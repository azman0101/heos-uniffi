name: HEOS Fader APK

on:
  push:
    branches: [main]
    paths:
      - 'heos_core/**'
      - 'uniffi-bindgen/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'android/**'
      - 'scripts/**'
      - '.github/workflows/heos-apk.yml'
  pull_request:
    paths:
      - 'heos_core/**'
      - 'uniffi-bindgen/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'android/**'
      - 'scripts/**'
      - '.github/workflows/heos-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heos-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: '30.0.16248370'
  ANDROID_PLATFORM: 'platforms;android-36'
  CARGO_NDK_VERSION: '4.1.2'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools ${{ env.ANDROID_PLATFORM }} build-tools;36.0.0 ndk;${{ env.NDK_VERSION }}'

      - name: Configure Android SDK and NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          shared-key: heos-apk
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-ndk@${{ env.CARGO_NDK_VERSION }}

      - name: Test Rust core (fake devices only)
        run: cargo test --workspace --locked

      # This script builds both ABIs, then invokes gen-kotlin.sh itself.
      - name: Build Android libraries and Kotlin bindings
        run: ./scripts/build-android.sh

      - uses: gradle/actions/setup-gradle@7ca78c16c887dc6c5f36fd6d0cb0f5c23d940e69 # v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Restore shared signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.HEOS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HEOS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HEOS_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo '::notice::No shared key available; APK uses a temporary debug signing identity.'
            echo 'identity=temporary' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/heos-signing.keystore"
          echo "HEOS_KEYSTORE_FILE=$RUNNER_TEMP/heos-signing.keystore" >> "$GITHUB_ENV"
          echo 'identity=shared' >> "$GITHUB_OUTPUT"

      - name: Kotlin unit tests and debug APK
        working-directory: android
        env:
          HEOS_KEYSTORE_PASSWORD: ${{ secrets.HEOS_KEYSTORE_PASSWORD }}
          HEOS_KEY_ALIAS: ${{ secrets.HEOS_KEY_ALIAS }}
          HEOS_KEY_PASSWORD: ${{ secrets.HEOS_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain

      - name: Verify native libraries in APK
        run: python3 scripts/verify-apk.py android/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify signing certificate
        if: steps.signing.outputs.identity == 'shared'
        env:
          EXPECTED_SHA256: ${{ secrets.HEOS_CERT_SHA256 }}
        run: |
          test -n "$EXPECTED_SHA256"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs \
            android/app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/apk-certificate.txt"
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-certificate.txt")
          test "$actual" = "$EXPECTED_SHA256"

      - name: Remove restored signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/heos-signing.keystore"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: heos-fader-debug-apk-${{ steps.signing.outputs.identity }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
